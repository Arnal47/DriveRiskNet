[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driverisknet"
version = "0.1.0"
description = "Reproducible PyTorch baselines for driving-risk classification from vehicle time-series signals."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "scikit-learn>=1.4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
